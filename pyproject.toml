[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kogwistar-agent-suite"
version = "0.1.0"
description = "Installable tools, plugins, hooks, MCP descriptors, skills, and profiles for Kogwistar agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["kogwistar>=0.6.1"]

[project.scripts]
kogwistar-agent-suite = "kogwistar_agent_suite.cli:main"

[project.optional-dependencies]
test = ["pytest>=8"]
github = ["httpx>=0.28"]
browser = ["playwright>=1.45,<2"]
slack = ["slack-sdk>=3.0"]
atlassian = ["httpx>=0.28"]
all-adapters = ["httpx>=0.28", "playwright>=1.45,<2", "slack-sdk>=3.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "ci: deterministic pull-request-safe suite tests",
]

[tool.ruff]
extend-exclude = ["pytest-cache-files-*", ".pytest*"]

[tool.ruff.lint]
# Match Kogwistar core's stable lint gate; avoid imposing unrelated style
# migrations on this optional composition package.
select = ["E4", "E7", "E9", "F"]
