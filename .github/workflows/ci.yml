name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Set up Rust for the core package
        uses: dtolnay/rust-toolchain@stable

      - name: Install current Kogwistar core
        run: python -m pip install --upgrade pip && python -m pip install "kogwistar @ git+https://github.com/humblemat810/kogwistar.git@main"

      - name: Install suite test dependencies
        run: |
          python -m pip install "pytest>=8" "ruff==0.16.7"
          python -m pip install "kogwistar-agent @ git+https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/humblemat810/kogwistar-agent.git@f222bcdcb67ec611dd383c34ea1d16bf7d5707c5"
          python -m pip install --no-deps -e .

      - name: Lint
        run: python -m ruff check src tests

      - name: Run deterministic CI tests
        run: python -m pytest -m ci

  rust:
    name: Rust agent suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Check formatting
        working-directory: rust
        run: cargo fmt --all -- --check
      - name: Check Rust
        working-directory: rust
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test Rust
        working-directory: rust
        run: cargo test --workspace --locked
