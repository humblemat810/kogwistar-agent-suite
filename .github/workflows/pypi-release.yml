name: PyPI Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypi-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - id: version
        name: Verify tag and package version
        run: |
          RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            test "${GITHUB_REF_TYPE}" = "tag"
            test "${GITHUB_REF_NAME}" = "v${RELEASE_VERSION}"
          fi
          grep -Fq "version = \"${RELEASE_VERSION}\"" pyproject.toml
          echo "version=${RELEASE_VERSION}" >> "${GITHUB_OUTPUT}"

  wheels:
    needs: verify-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: wheel-linux-x86_64
          - os: windows-latest
            artifact: wheel-windows-x86_64
          - os: macos-15-intel
            artifact: wheel-macos-x86_64
          - os: macos-15
            artifact: wheel-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - name: Build native wheel
        run: |
          python -m pip install --upgrade pip maturin
          python -m maturin build --release --locked --out dist

      - name: Upload tested wheel
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - name: Build and check source distribution
        run: |
          python -m pip install --upgrade pip maturin twine
          python -m maturin sdist --out dist
          python -m twine check dist/*

      - name: Upload source distribution
        uses: actions/upload-artifact@v4
        with:
          name: source-distribution
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [verify-release, wheels, sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/kogwistar-agent-suite
    permissions:
      id-token: write
    steps:
      - name: Download tested release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Validate release artifacts
        run: |
          python -m pip install --upgrade pip twine
          python -m twine check dist/*
          test -n "$(find dist -maxdepth 1 -name 'kogwistar_agent_suite-${{ needs.verify-release.outputs.version }}-*.whl' -print -quit)"
          test -n "$(find dist -maxdepth 1 -name 'kogwistar_agent_suite-${{ needs.verify-release.outputs.version }}.tar.gz' -print -quit)"
          find dist -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Publish to PyPI through Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
